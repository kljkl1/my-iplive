name: Validate IPTV Project

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate channel database
        run: |
          python scripts/validate.py

      - name: Generate playlist
        run: |
          python scripts/generate_playlist.py

      - name: Validate EPG
        run: |
          python scripts/validate_epg.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Test M3U importer
        run: |
          python scripts/import_m3u.py tests/sample.m3u -o tests/imported_channels.json

      - name: Validate imported M3U data
        run: |
          python scripts/validate.py tests/imported_channels.json

      - name: Check generated playlist
        run: |
          test -f playlists/all.m3u

      - name: Show generated playlist
        run: |
          cat playlists/all.m3u