name: Update IPTV Data
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate channel database
        run: |
          python scripts/validate.py
      - name: Check channel URLs
        run: |
          python scripts/check_urls.py
      - name: Generate playlists
        run: |
          python scripts/generate_playlist.py
      - name: Validate EPG
        run: |
          python scripts/validate_epg.py
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
      - name: Check generated playlist
        run: |
          test -f playlists/all.m3u
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json playlists/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update IPTV status and playlists"
          git push
